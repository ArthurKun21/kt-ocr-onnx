name: ABI Validation

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.idea/**'
      - 'jitpack.yml'
      - '**/.gitignore'
      - '**/*.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'gradle/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'kt-ocr-onnx*/**'
      - 'detection/**'
      - 'recognition/**'
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: 'temurin'

concurrency:
  group: ${{ github.ref }}-abi
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  abi:
    name: Check ABI compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check ABI compatibility
        run: >-
          ./gradlew
          :kt-ocr-onnx:checkKotlinAbi
          :kt-ocr-onnx-core:checkKotlinAbi
          :kt-ocr-onnx-detection:checkKotlinAbi
          :kt-ocr-onnx-recognition:checkKotlinAbi
